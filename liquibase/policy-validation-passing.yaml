databaseChangeLog:

  # Compliant 1 — schema_name_limit: "create schema sales_rpt" is 23 chars (<= 30),
  # so both the schema name and the full regex match stay under the limit.
  - changeSet:
      id: policy-compliant-schema-name-short
      author: policy-test
      comment: "POLICY COMPLIANT: short schema name sales_rpt (well under 30 characters)"
      changes:
        - sql:
            sql: CREATE SCHEMA sales_rpt;
      rollback:
        - sql:
            sql: DROP SCHEMA IF EXISTS sales_rpt;

  # Compliant 2 — prevent_direct_system_table_access: no reads from information_schema,
  # pg_catalog, or any other system table. Uses Liquibase's own precondition instead of
  # querying the catalog directly.
  - changeSet:
      id: policy-compliant-no-system-table-access
      author: policy-test
      comment: "POLICY COMPLIANT: only touches application objects, never system tables"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: public
                tableName: orders
      changes:
        - sql:
            sql: SELECT 1;
      rollback:
        - sql:
            sql: SELECT 1;

  # Compliant 3 — table_name_limit: schema-prefixed form, table name "orders" is 6 chars (<= 10).
  - changeSet:
      id: policy-compliant-table-name-short
      author: policy-test
      comment: "POLICY COMPLIANT: table name orders is 6 characters (<= 10)"
      changes:
        - sql:
            sql: |
              CREATE TABLE public.orders (
                  id          SERIAL PRIMARY KEY,
                  order_id    INT            NOT NULL,
                  product_id  INT            NOT NULL,
                  quantity    INT            NOT NULL CHECK (quantity > 0),
                  unit_price  NUMERIC(10,2)  NOT NULL
              );
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS public.orders;

  # Compliant 4 — prevent_large_transactions: 10 INSERT statements in this changeset.
  # Total across the whole file = 1 (schema) + 1 (select) + 1 (table) + 10 = 13 (<= 50).
  - changeSet:
      id: policy-compliant-few-statements
      author: policy-test
      comment: "POLICY COMPLIANT: 10 INSERT statements, file total stays far below the 50-statement limit"
      changes:
        - sql:
            sql: |
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (1, 1, 1, 9.99);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (1, 2, 2, 14.99);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (1, 3, 1, 4.99);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (2, 1, 3, 9.99);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (2, 4, 1, 24.99);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (2, 5, 2, 49.00);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (3, 2, 1, 14.99);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (3, 6, 1, 68.99);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (4, 3, 4, 4.99);
              INSERT INTO public.orders (order_id, product_id, quantity, unit_price) VALUES (4, 7, 1, 18.99);
      rollback:
        - sql:
            sql: DELETE FROM public.orders WHERE order_id BETWEEN 1 AND 4;

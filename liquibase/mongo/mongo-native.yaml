databaseChangeLog:
  - changeSet:
      id: harness-1
      author: harness
      runWith: mongosh
      comment: Create person collection using native mongosh JavaScript - HARNESS ONLY
      mongo:
        mongo: |
          // Native MongoDB JavaScript execution
          db.createCollection("person", {
             validator: {
                $jsonSchema: {
                   bsonType: "object",
                   required: ["name", "address"],
                   properties: {
                      name: {
                         bsonType: "string",
                         description: "The Name"
                      },
                      address: {
                         bsonType: "string",
                         description: "The Address"
                      },
                      age: {
                         bsonType: "int",
                         description: "The Age"
                      }
                   }
                }
             },
             validationAction: "error",
             validationLevel: "strict"
          });

          print("Collection 'person' created with validation schema");
      rollback:
        mongosh:
          mongo: |
            db.person.drop();
            print("Collection 'person' dropped");

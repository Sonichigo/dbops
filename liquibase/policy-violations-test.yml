databaseChangeLog:

  # Violation 1 — schema_name_limit: full regex match "create schema <name>" exceeds 30 chars
  - changeSet:
      id: policy-violation-schema-name-too-long
      author: policy-test
      comment: "POLICY VIOLATION: schema name analytics_reporting_schema_extended_v2 exceeds 30 characters"
      changes:
        - sql:
            sql: CREATE SCHEMA analytics_reporting_schema_extended_v2;
      rollback:
        - sql:
            sql: DROP SCHEMA IF EXISTS analytics_reporting_schema_extended_v2;

  # Violation 2 — prevent_direct_system_table_access: SELECT ... FROM information_schema.*
  - changeSet:
      id: policy-violation-system-table-access
      author: policy-test
      comment: "POLICY VIOLATION: direct read from information_schema system table"
      changes:
        - sql:
            sql: SELECT table_name, table_type FROM information_schema.tables WHERE table_schema = 'public';
      rollback:
        - sql:
            sql: SELECT 1;

  # Violation 3 — table_name_limit: schema-prefixed form so the regex split isolates the table
  # name "order_line_items" (16 chars > 10); without the prefix the full match string is used
  # and also exceeds 10, but the schema prefix makes the intent explicit.
  - changeSet:
      id: policy-violation-table-name-too-long
      author: policy-test
      comment: "POLICY VIOLATION: table name order_line_items exceeds 10 characters"
      changes:
        - sql:
            sql: |
              CREATE TABLE public.order_line_items (
                  id          SERIAL PRIMARY KEY,
                  order_id    INT            NOT NULL,
                  product_id  INT            NOT NULL,
                  quantity    INT            NOT NULL CHECK (quantity > 0),
                  unit_price  NUMERIC(10,2)  NOT NULL
              );
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS public.order_line_items;

  # Violation 4 — prevent_large_transactions: 52 INSERT statements in one changeset (> 50)
  # Combined with the 3 statements above, the total across this file is 55 > 50.
